name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries for GPUI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang \
            libfontconfig1-dev \
            libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xkb-dev \
            libssl-dev libzstd-dev
      - name: Test
        run: cargo test --workspace --locked

  windows:
    name: Build envy.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test path labels
        run: cargo test -p envy-core --locked --lib labels
      - name: Test saves
        run: cargo test -p envy-core --locked --lib session
      - name: Release build
        run: cargo build --release -p envy --locked
      - uses: actions/upload-artifact@v4
        with:
          name: envy-windows
          path: target/release/envy.exe
          if-no-files-found: error
